<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=https://papauditor.streamlit.app" />
    <title>Redirecting to Audit Tool</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f2f6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paw à Peau Audit Tool</h1>
        <p>Redirecting to the application...</p>
        <div class="spinner"></div>
        <p>If you're not redirected automatically, <a href="https://papauditor.streamlit.app">click here</a>.</p>
    </div>
</body>
</html>
